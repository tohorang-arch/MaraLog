<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>마라로그</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#f7f1e6;
    --surface:#ffffff;
    --surface-2:#f1e6d3;
    --text:#241a12;
    --text-dim:#6b5c4d;
    --accent:#c81d25;
    --accent-ink:#ffffff;
    --accent-2:#5f7a45;
    --gold:#b5811d;
    --border:rgba(36,26,18,0.14);
    --shadow:0 1px 2px rgba(36,26,18,0.06), 0 8px 24px rgba(36,26,18,0.08);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17130f; --surface:#221b16; --surface-2:#2b221b;
      --text:#f4ead9; --text-dim:#bfae98;
      --accent:#e2493c; --accent-ink:#1a0f0c; --accent-2:#93a878; --gold:#dcb44c;
      --border:rgba(244,234,217,0.14);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 30px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17130f; --surface:#221b16; --surface-2:#2b221b;
    --text:#f4ead9; --text-dim:#bfae98;
    --accent:#e2493c; --accent-ink:#1a0f0c; --accent-2:#93a878; --gold:#dcb44c;
    --border:rgba(244,234,217,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 30px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  .wrap{max-width:960px;margin:0 auto;padding:20px 20px 0;width:100%;}
  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding-bottom:16px;border-bottom:2px solid var(--text);flex-wrap:wrap;
  }
  .brand h1{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-weight:900;
    font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:-0.01em;text-wrap:balance;
  }
  .brand h1 .glyph{color:var(--accent);}
  .brand p{margin:6px 0 0;color:var(--text-dim);font-size:14px;}
  .stats{display:flex;gap:22px;font-family:"IBM Plex Mono",monospace;}
  .stat{text-align:right;}
  .stat b{display:block;font-size:22px;color:var(--accent);line-height:1.1;}
  .stat span{font-size:11px;color:var(--text-dim);letter-spacing:0.04em;}

  .device-note{
    max-width:960px;margin:14px auto 0;padding:0 20px;
  }
  .device-note p{
    background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;
    padding:9px 14px;font-size:12px;color:var(--text-dim);margin:0;
  }

  nav.tabs{
    max-width:960px;margin:16px auto 0;padding:0 20px;display:flex;gap:4px;width:100%;
  }
  nav.tabs button{
    background:transparent;border:none;border-bottom:3px solid transparent;
    padding:10px 6px;margin-right:14px;font-size:15px;font-weight:700;color:var(--text-dim);
  }
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{flex:1;display:flex;flex-direction:column;min-height:0;}
  section.tab{display:none;flex:1;min-height:0;flex-direction:column;}
  section.tab.active{display:flex;}

  #map{flex:1;min-height:360px;width:100%;}
  /* 무료·무키 정책이 계속 안정적인 표준 OSM 타일을 쓰되, 채도와 대비를 낮춰
     시각적으로 더 단순하고 차분하게 보이도록 다듬음. */
  .map-tiles-simple{ filter: grayscale(38%) saturate(55%) contrast(92%) brightness(1.1); }
  .map-shell{position:relative;flex:1;display:flex;}
  .fab{
    position:absolute;right:20px;bottom:24px;z-index:500;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;
    padding:14px 20px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);
  }
  .leaflet-popup-content{font-family:"Pretendard",sans-serif;}
  .popup-card{min-width:160px;}
  .popup-card b{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:15px;display:block;margin-bottom:2px;}
  .popup-card img{width:100%;height:90px;object-fit:cover;border-radius:6px;margin:6px 0;}
  .popup-card .meta{font-size:12px;color:var(--text-dim);}
  .popup-card .goto{
    display:inline-block;margin-top:6px;font-size:12.5px;color:var(--accent);
    text-decoration:underline;background:none;border:none;padding:0;
  }

  .wrap.board-wrap{padding-top:18px;padding-bottom:80px;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;
  }
  .search:focus{outline:2px solid var(--accent);outline-offset:1px;}
  select.sort{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;font-size:13.5px;color:var(--text);font-family:inherit;
  }
  .btn-primary{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
    padding:11px 18px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    border-radius:10px;padding:9px 14px;font-size:13.5px;
  }

  .feed{display:flex;flex-direction:column;gap:18px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:16px;
  }
  .card.flash{outline:2px solid var(--accent);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 2px;gap:12px;}
  .card-head h2{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:20px;margin:0;font-weight:700;text-wrap:balance;}
  .address{padding:0 20px;font-size:12.5px;color:var(--text-dim);}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;padding:8px 20px 14px;font-size:13px;color:var(--text-dim);align-items:center;}
  .meta-row .date{font-family:"IBM Plex Mono",monospace;color:var(--text);}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12.5px;}
  .spice{color:var(--accent);letter-spacing:1px;}
  .rating{color:var(--gold);letter-spacing:1px;}
  .photos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:2px;overflow-x:auto;background:var(--border);}
  .photos img{width:100%;height:210px;object-fit:cover;display:block;background:var(--surface-2);cursor:pointer;}
  .note{padding:14px 20px 4px;font-size:14.5px;white-space:pre-wrap;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 16px;font-size:12px;color:var(--text-dim);}
  .card-foot .del{background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:2px;}
  .card-foot .del:hover{color:var(--accent);}

  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty .glyph{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:38px;color:var(--accent);display:block;margin-bottom:10px;}

  .photo-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;
    max-width:960px;margin:0 auto;padding:18px 20px 80px;width:100%;
  }
  .photo-grid button{
    padding:0;border:none;border-radius:10px;overflow:hidden;background:var(--surface-2);
    aspect-ratio:1/1;
  }
  .photo-grid img{width:100%;height:100%;object-fit:cover;display:block;}

  dialog#composer, dialog#lightbox{
    border:none;border-radius:16px;padding:0;max-width:520px;width:92vw;
    background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(20,14,10,0.55);}
  .composer-inner{padding:22px 22px 20px;max-height:85vh;overflow-y:auto;}
  .composer-inner h3{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;margin:0 0 16px;font-size:22px;}
  .field{margin-bottom:13px;position:relative;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;letter-spacing:0.02em;}
  .field input[type="text"], .field input[type="date"], .field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .starpick, .spicepick{display:flex;gap:6px;font-size:20px;}
  .starpick button, .spicepick button{background:none;border:none;color:var(--border);padding:0;}
  .starpick button.on{color:var(--gold);}
  .spicepick button.on{color:var(--accent);}
  .file-row{border:1.5px dashed var(--border);border-radius:10px;padding:12px;text-align:center;font-size:13px;color:var(--text-dim);}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;}
  .composer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:14px;}

  .place-search-box{position:relative;}
  .place-results{
    position:absolute;top:100%;left:0;right:0;z-index:10;margin-top:4px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;
  }
  .place-results button{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:9px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);
  }
  .place-results button:last-child{border-bottom:none;}
  .place-results button:hover{background:var(--surface-2);}
  .place-results .sub{display:block;font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .place-picked{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px;font-size:13px;
  }
  .place-picked .clear{background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:0;}
  .pick-on-map{margin-top:6px;font-size:12.5px;}
  .pick-hint-banner{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:600;
    background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:999px;
    font-size:13px;font-weight:700;box-shadow:var(--shadow);display:none;
  }

  #lightbox .lb-inner{padding:0;}
  #lightbox img{width:100%;max-height:70vh;object-fit:contain;background:#000;display:block;}
  #lightbox .lb-cap{padding:14px 18px;font-size:13.5px;}
  #lightbox .lb-cap b{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;display:block;margin-bottom:2px;}
  #lightbox .lb-close{
    position:absolute;top:8px;right:10px;background:rgba(0,0,0,0.55);color:#fff;
    border:none;border-radius:999px;width:30px;height:30px;font-size:16px;
  }

  @media (prefers-reduced-motion:no-preference){ .card{transition:outline-color .2s ease;} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="glyph">麻辣</span> 마라로그</h1>
      <p>얼얼한 맛을 쫓아다니는 사람들의 방문 기록</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
</div>

<div class="device-note"><p>이 페이지는 지금은 이 브라우저에만 기록을 저장해요. 모임원들과 실시간으로 공유하려면 다음 단계에서 데이터 저장소(Firebase) 연동이 필요해요.</p></div>

<nav class="tabs">
  <button data-tab="map" class="active">지도</button>
  <button data-tab="board">게시판</button>
  <button data-tab="photos">포토 게시판</button>
</nav>

<main>
  <section class="tab active" id="tab-map">
    <div class="map-shell">
      <div id="map"></div>
      <div class="pick-hint-banner" id="pickHintBanner">지도에서 위치를 클릭하세요</div>
      <button class="fab" id="openComposer">+ 기록 남기기</button>
    </div>
  </section>

  <section class="tab" id="tab-board">
    <div class="wrap board-wrap">
      <div class="toolbar">
        <input class="search" id="searchInput" type="text" placeholder="식당 이름으로 검색" />
        <select class="sort" id="sortSelect">
          <option value="new">최신순</option>
          <option value="rating">평점 높은순</option>
          <option value="spice">매운맛 강한순</option>
        </select>
      </div>
      <div class="feed" id="feed"></div>
    </div>
  </section>

  <section class="tab" id="tab-photos">
    <div class="photo-grid" id="photoGrid"></div>
  </section>
</main>

<dialog id="composer">
  <form class="composer-inner" id="composerForm">
    <h3>오늘의 마라 기록</h3>

    <div class="field">
      <label>모임 장소</label>
      <div id="placePickedBox" style="display:none" class="place-picked">
        <span id="placePickedText"></span>
        <button type="button" class="clear" id="placeClear">다시 검색</button>
      </div>
      <div class="place-search-box">
        <input type="text" id="placeSearchInput" placeholder="식당 이름이나 주소로 검색" autocomplete="off" />
        <div class="place-results" id="placeResults" hidden></div>
      </div>
      <button type="button" class="btn-ghost pick-on-map" id="pickOnMapBtn">검색 대신 지도에서 직접 위치 찍기</button>
    </div>

    <div class="row2">
      <div class="field">
        <label>방문 날짜</label>
        <input type="date" id="f-date" required />
      </div>
      <div class="field">
        <label>함께 간 사람</label>
        <input type="text" id="f-participants" placeholder="쉼표로 구분 (예: 햇쭈, 민수)" />
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>매운맛 단계</label>
        <div class="spicepick" id="spicepick">
          <button type="button" data-v="1">🌶</button><button type="button" data-v="2">🌶</button>
          <button type="button" data-v="3">🌶</button><button type="button" data-v="4">🌶</button>
          <button type="button" data-v="5">🌶</button>
        </div>
      </div>
      <div class="field">
        <label>평점</label>
        <div class="starpick" id="starpick">
          <button type="button" data-v="1">★</button><button type="button" data-v="2">★</button>
          <button type="button" data-v="3">★</button><button type="button" data-v="4">★</button>
          <button type="button" data-v="5">★</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>후기</label>
      <textarea id="f-note" placeholder="맛, 분위기, 웨이팅 등 자유롭게"></textarea>
    </div>
    <div class="field">
      <label>사진</label>
      <div class="file-row">
        <input type="file" id="f-photos" accept="image/*" multiple />
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>
    <div class="field">
      <label>작성자</label>
      <input type="text" id="f-author" placeholder="이름" />
    </div>
    <div class="composer-actions">
      <button type="button" class="btn-ghost" id="cancelComposer">취소</button>
      <button type="submit" class="btn-primary" id="submitComposer">기록 올리기</button>
    </div>
    <p class="hint">위치를 검색해 선택하거나 지도에서 직접 찍어야 저장할 수 있어요. 사진은 자동으로 압축돼요.</p>
  </form>
</dialog>

<dialog id="lightbox">
  <div class="lb-inner" style="position:relative">
    <button class="lb-close" id="lbClose">×</button>
    <img id="lbImg" src="" alt="" />
    <div class="lb-cap"><b id="lbTitle"></b><span id="lbSub"></span></div>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Data store. Everything reads/writes through these two functions,
  // so swapping localStorage for Firebase Firestore later only means
  // rewriting loadPosts()/savePosts() (and calling renderAll() from a
  // Firestore onSnapshot listener instead of after each local change).
  // ---------------------------------------------------------------
  var STORAGE_KEY = "malalog_posts_v1";
  function loadPosts(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function savePosts(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    catch(e){ alert("저장에 실패했어요. 사진 용량이 크면 브라우저 저장 공간이 부족할 수 있어요."); }
  }

  var posts = loadPosts();

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(d){
    if(!d) return "";
    var p = d.split("-");
    return p.length===3 ? p[0]+"."+p[1]+"."+p[2] : d;
  }
  function stars(n,ch,cls){
    var out = "";
    for(var i=1;i<=5;i++){ out += i<=n ? ch : "·"; }
    return '<span class="'+cls+'">'+out+'</span>';
  }

  // ---------------- tabs ----------------
  var tabButtons = document.querySelectorAll("nav.tabs button");
  var tabSections = { map: document.getElementById("tab-map"), board: document.getElementById("tab-board"), photos: document.getElementById("tab-photos") };
  tabButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      tabButtons.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(tabSections).forEach(function(k){ tabSections[k].classList.remove("active"); });
      var key = btn.dataset.tab;
      tabSections[key].classList.add("active");
      if(key === "map" && map){ setTimeout(function(){ map.invalidateSize(); }, 0); }
    });
  });

  function goToBoardAndFlash(postId){
    tabButtons.forEach(function(b){ b.classList.toggle("active", b.dataset.tab === "board"); });
    Object.keys(tabSections).forEach(function(k){ tabSections[k].classList.toggle("active", k === "board"); });
    setTimeout(function(){
      var el = document.querySelector('.card[data-id="'+postId+'"]');
      if(el){
        el.scrollIntoView({behavior:"smooth", block:"center"});
        el.classList.add("flash");
        setTimeout(function(){ el.classList.remove("flash"); }, 1600);
      }
    }, 50);
  }

  // ---------------- map ----------------
  // Guarded: if the Leaflet CDN fails to load (offline, blocked network),
  // the map simply stays unavailable instead of breaking the whole page —
  // the board and photo tabs keep working either way.
  // 기록이 하나도 없을 때(=지도에 맞춰 확대할 마커가 없을 때)의 기본 중심 좌표.
  // 신림역(서울 관악구) 기준값 — 나중에 필요하면 이 값만 바꾸면 됨.
  var DEFAULT_CENTER = [37.48417, 126.92972];
  var DEFAULT_ZOOM = 15;

  var map = null;
  try{
    if(typeof L !== "undefined"){
      map = L.map("map", { zoomControl:true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
      // 표준 OpenStreetMap 타일 — 키 등록 없이 계속 무료로 쓸 수 있는 몇 안 되는
      // 타일 서버라 이걸 기본으로 쓰고, 대신 CSS 필터로 채도/대비를 낮춰서
      // 시각적으로 더 차분하고 단순하게 보이도록 했음(className: "map-tiles-simple").
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        className: "map-tiles-simple",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // 아직 저장된 기록(마커)이 없을 때만 위치 기반으로 초기 시점을 잡음 —
      // 기록이 있으면 renderMarkers()가 마커들에 맞춰 알아서 확대/축소함.
      if(posts.length === 0 && navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          function(pos){
            map.setView([pos.coords.latitude, pos.coords.longitude], DEFAULT_ZOOM);
          },
          function(){ /* 권한 거부/실패 시 기본 좌표(신림역) 그대로 사용 */ },
          { timeout: 6000, maximumAge: 5 * 60 * 1000 }
        );
      }
    } else {
      document.getElementById("map").innerHTML = '<div class="empty" style="padding:40px 20px"><span class="glyph">麻辣</span>지도를 불러오지 못했어요.<br/>인터넷 연결을 확인하고 새로고침 해주세요.</div>';
    }
  }catch(err){ console.warn("map init failed", err); }

  var markers = {};
  function renderMarkers(){
    if(!map) return;
    Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
    markers = {};
    var pts = [];
    posts.forEach(function(p){
      if(typeof p.lat !== "number" || typeof p.lng !== "number") return;
      var m = L.marker([p.lat, p.lng]).addTo(map);
      var thumb = (p.photos && p.photos[0]) ? '<img src="'+p.photos[0]+'" alt="" />' : "";
      m.bindPopup(
        '<div class="popup-card">'+
          '<b>'+esc(p.restaurant)+'</b>'+
          '<span class="meta">'+fmtDate(p.date)+(p.rating?(' · '+stars(p.rating,"★","rating")):"")+'</span>'+
          thumb+
          '<button type="button" class="goto" data-goto="'+p.id+'">게시판에서 보기</button>'+
        '</div>'
      );
      markers[p.id] = m;
      pts.push([p.lat, p.lng]);
    });
    if(pts.length){ map.fitBounds(pts, { padding:[40,40], maxZoom:15 }); }
  }
  if(map){
    map.on("popupopen", function(e){
      var btn = e.popup._contentNode.querySelector("[data-goto]");
      if(btn){ btn.addEventListener("click", function(){ goToBoardAndFlash(btn.getAttribute("data-goto")); }); }
    });
  }

  // ---------------- place search (Nominatim / OpenStreetMap) ----------------
  var placeInput = document.getElementById("placeSearchInput");
  var placeResults = document.getElementById("placeResults");
  var placePickedBox = document.getElementById("placePickedBox");
  var placePickedText = document.getElementById("placePickedText");
  var placeClear = document.getElementById("placeClear");
  var pickOnMapBtn = document.getElementById("pickOnMapBtn");
  var pickHintBanner = document.getElementById("pickHintBanner");

  var selectedPlace = null; // {name, address, lat, lng}
  var searchTimer = null;
  var searchAbort = null;

  function showPicked(place){
    selectedPlace = place;
    placeInput.style.display = "none";
    placeResults.hidden = true;
    placePickedBox.style.display = "flex";
    placePickedText.textContent = place.name + (place.address ? " · " + place.address : "");
  }
  function clearPicked(){
    selectedPlace = null;
    placeInput.style.display = "";
    placeInput.value = "";
    placePickedBox.style.display = "none";
  }
  placeClear.addEventListener("click", clearPicked);

  placeInput.addEventListener("input", function(){
    var q = placeInput.value.trim();
    if(searchTimer) clearTimeout(searchTimer);
    if(q.length < 2){ placeResults.hidden = true; placeResults.innerHTML = ""; return; }
    searchTimer = setTimeout(function(){ runPlaceSearch(q); }, 550);
  });

  function showPlaceMsg(text){
    placeResults.innerHTML = '<div style="padding:10px 12px;font-size:12.5px;color:var(--text-dim)">'+esc(text)+'</div>';
    placeResults.hidden = false;
  }

  function runPlaceSearch(q){
    if(searchAbort) searchAbort.abort();
    searchAbort = new AbortController();
    showPlaceMsg("검색 중…");
    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ko&q=" + encodeURIComponent(q);
    fetch(url, { signal: searchAbort.signal, headers: { "Accept": "application/json" } })
      .then(function(r){
        if(!r.ok){ throw new Error("http_" + r.status); }
        return r.json();
      })
      .then(function(list){
        if(!list.length){
          showPlaceMsg("검색 결과가 없어요. 지도에서 직접 위치를 찍어보세요.");
          return;
        }
        placeResults.innerHTML = list.map(function(item, i){
          return '<button type="button" data-i="'+i+'">'+esc(item.display_name.split(",")[0])+
            '<span class="sub">'+esc(item.display_name)+'</span></button>';
        }).join("");
        placeResults.hidden = false;
        Array.prototype.forEach.call(placeResults.querySelectorAll("button"), function(btn, i){
          btn.addEventListener("click", function(){
            var item = list[i];
            showPicked({
              name: item.display_name.split(",")[0],
              address: item.display_name,
              lat: parseFloat(item.lat),
              lng: parseFloat(item.lon)
            });
          });
        });
      })
      .catch(function(err){
        if(err.name === "AbortError") return; // superseded by a newer keystroke — expected, not an error
        console.warn("place search failed", err);
        showPlaceMsg("검색에 실패했어요 (네트워크 문제일 수 있어요). 지도에서 직접 위치를 찍어보세요.");
      });
  }

  var pickingOnMap = false;
  pickOnMapBtn.addEventListener("click", function(){
    if(!map){ alert("지도를 불러오지 못해 직접 찍기를 쓸 수 없어요. 검색으로 위치를 찾아주세요."); return; }
    pickingOnMap = true;
    dlg.close();
    pickHintBanner.style.display = "block";
  });
  if(map){
    map.on("click", function(e){
      if(!pickingOnMap) return;
      pickingOnMap = false;
      pickHintBanner.style.display = "none";
      var lat = e.latlng.lat, lng = e.latlng.lng;
      reverseGeocode(lat, lng).then(function(name){
        showPicked({ name: name || "선택한 위치", address: "", lat: lat, lng: lng });
        dlg.showModal();
      });
    });
  }
  function reverseGeocode(lat, lng){
    var url = "https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ko&lat="+lat+"&lon="+lng;
    return fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.display_name) return null;
      return (d.name || d.display_name.split(",")[0]);
    }).catch(function(){ return null; });
  }

  // ---------------- render: stats / board / photos ----------------
  function renderStats(){
    var restaurants = {};
    var totalRating = 0, ratingCount = 0;
    posts.forEach(function(p){ restaurants[p.restaurant]=true; if(p.rating){ totalRating+=p.rating; ratingCount++; } });
    var avg = ratingCount ? (totalRating/ratingCount).toFixed(1) : "–";
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>'+posts.length+'</b><span>총 방문</span></div>'+
      '<div class="stat"><b>'+Object.keys(restaurants).length+'</b><span>탐방한 맛집</span></div>'+
      '<div class="stat"><b>'+avg+'</b><span>평균 평점</span></div>';
  }

  function currentList(){
    var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
    var sort = document.getElementById("sortSelect").value;
    var list = posts.filter(function(p){ return !q || (p.restaurant||"").toLowerCase().indexOf(q) !== -1; });
    list = list.slice();
    if(sort==="rating"){ list.sort(function(a,b){ return (b.rating||0)-(a.rating||0); }); }
    else if(sort==="spice"){ list.sort(function(a,b){ return (b.spice||0)-(a.spice||0); }); }
    else { list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }); }
    return list;
  }

  function renderFeed(){
    var feed = document.getElementById("feed");
    var list = currentList();
    if(list.length===0){
      feed.innerHTML = '<div class="empty"><span class="glyph">麻辣</span>아직 기록이 없어요.<br/>지도에서 첫 마라 탐방을 남겨보세요.</div>';
      return;
    }
    feed.innerHTML = list.map(function(p){
      var photosHtml = (p.photos&&p.photos.length)
        ? '<div class="photos">'+p.photos.map(function(src){return '<img src="'+src+'" alt="'+esc(p.restaurant)+' 사진" loading="lazy" data-lightbox="'+esc(src)+'" data-cap="'+esc(p.restaurant)+'|'+esc(fmtDate(p.date))+'" />';}).join("")+'</div>'
        : "";
      var participants = (p.participants&&p.participants.length)
        ? p.participants.map(function(n){return '<span class="pill">'+esc(n)+'</span>';}).join("") : "";
      return (
        '<article class="card" data-id="'+p.id+'">'+
          '<div class="card-head"><h2>'+esc(p.restaurant)+'</h2>'+(p.rating ? stars(p.rating,"★","rating") : "")+'</div>'+
          (p.address ? '<div class="address">'+esc(p.address)+'</div>' : "")+
          '<div class="meta-row"><span class="date">'+fmtDate(p.date)+'</span>'+
            (p.spice ? '<span class="pill">'+stars(p.spice,"🌶","spice")+'</span>' : "")+participants+'</div>'+
          photosHtml+
          (p.note ? '<div class="note">'+esc(p.note)+'</div>' : "")+
          '<div class="card-foot"><span>'+(p.author?esc(p.author)+' 기록':"")+'</span>'+
            '<button type="button" class="del" data-del="'+p.id+'">삭제</button></div>'+
        '</article>'
      );
    }).join("");
  }

  function renderPhotoGrid(){
    var grid = document.getElementById("photoGrid");
    var items = [];
    posts.forEach(function(p){
      (p.photos||[]).forEach(function(src){ items.push({src:src, restaurant:p.restaurant, date:p.date}); });
    });
    items.sort(function(){ return 0; });
    if(items.length===0){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="glyph">麻辣</span>아직 올라온 사진이 없어요.</div>';
      return;
    }
    grid.innerHTML = items.map(function(it){
      return '<button type="button" data-lightbox="'+esc(it.src)+'" data-cap="'+esc(it.restaurant)+'|'+esc(fmtDate(it.date))+'"><img src="'+it.src+'" alt="'+esc(it.restaurant)+'" loading="lazy" /></button>';
    }).join("");
  }

  function renderAll(){
    renderStats();
    renderMarkers();
    renderFeed();
    renderPhotoGrid();
  }

  // ---------------- lightbox ----------------
  var lightbox = document.getElementById("lightbox");
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-lightbox]");
    if(!t) return;
    var cap = (t.getAttribute("data-cap")||"").split("|");
    document.getElementById("lbImg").src = t.getAttribute("data-lightbox");
    document.getElementById("lbTitle").textContent = cap[0]||"";
    document.getElementById("lbSub").textContent = cap[1]||"";
    lightbox.showModal();
  });
  document.getElementById("lbClose").addEventListener("click", function(){ lightbox.close(); });
  lightbox.addEventListener("click", function(e){ if(e.target === lightbox) lightbox.close(); });

  // ---------------- add / delete ----------------
  function addPost(post){ posts.push(post); savePosts(posts); renderAll(); }
  function deletePost(id){
    if(!confirm("이 기록을 삭제할까요?")) return;
    posts = posts.filter(function(p){ return p.id !== id; });
    savePosts(posts); renderAll();
  }
  document.getElementById("feed").addEventListener("click", function(e){
    var btn = e.target.closest("[data-del]");
    if(btn){ deletePost(btn.getAttribute("data-del")); }
  });
  document.getElementById("searchInput").addEventListener("input", renderFeed);
  document.getElementById("sortSelect").addEventListener("change", renderFeed);

  // ---------------- composer ----------------
  var dlg = document.getElementById("composer");
  var pendingPhotos = [];
  var spiceVal = 0, ratingVal = 0;

  function resetComposer(){
    document.getElementById("composerForm").reset();
    clearPicked();
    placeResults.hidden = true; placeResults.innerHTML = "";
    pendingPhotos = []; spiceVal = 0; ratingVal = 0;
    document.getElementById("thumbs").innerHTML = "";
    paintPicker("spicepick", 0); paintPicker("starpick", 0);
    document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
  }
  function paintPicker(id, val){
    var wrap = document.getElementById(id);
    Array.prototype.forEach.call(wrap.children, function(btn, i){ btn.classList.toggle("on", i < val); });
  }
  document.getElementById("spicepick").addEventListener("click", function(e){
    if(e.target.tagName!=="BUTTON") return;
    spiceVal = parseInt(e.target.dataset.v,10); paintPicker("spicepick", spiceVal);
  });
  document.getElementById("starpick").addEventListener("click", function(e){
    if(e.target.tagName!=="BUTTON") return;
    ratingVal = parseInt(e.target.dataset.v,10); paintPicker("starpick", ratingVal);
  });

  function resizeImage(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var maxW = 900, scale = Math.min(1, maxW / img.width);
          var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = function(){ resolve(null); };
        img.src = reader.result;
      };
      reader.onerror = function(){ resolve(null); };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById("f-photos").addEventListener("change", async function(e){
    var files = Array.prototype.slice.call(e.target.files || []).slice(0,6);
    var thumbs = document.getElementById("thumbs");
    for(var i=0;i<files.length;i++){
      var dataUrl = await resizeImage(files[i]);
      if(dataUrl){ pendingPhotos.push(dataUrl); var img = document.createElement("img"); img.src = dataUrl; thumbs.appendChild(img); }
    }
  });

  document.getElementById("openComposer").addEventListener("click", function(){ resetComposer(); dlg.showModal(); });
  document.getElementById("cancelComposer").addEventListener("click", function(){ dlg.close(); });

  document.getElementById("composerForm").addEventListener("submit", function(e){
    e.preventDefault();
    if(!selectedPlace){
      alert("모임 장소를 검색해서 선택하거나, 지도에서 직접 위치를 찍어주세요.");
      return;
    }
    var post = {
      id: "p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      restaurant: selectedPlace.name,
      address: selectedPlace.address,
      lat: selectedPlace.lat,
      lng: selectedPlace.lng,
      date: document.getElementById("f-date").value,
      participants: document.getElementById("f-participants").value.split(",").map(function(s){return s.trim();}).filter(Boolean),
      spice: spiceVal,
      rating: ratingVal,
      note: document.getElementById("f-note").value.trim(),
      photos: pendingPhotos.slice(),
      author: document.getElementById("f-author").value.trim(),
      createdAt: Date.now()
    };
    dlg.close();
    addPost(post);
  });

  // ---------------- boot ----------------
  document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
  renderAll();
})();
</script>
</body>
</html>
