<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>마라진리회</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Firebase SDK — 항상 불러오되, 아래 스크립트에서 FIREBASE_CONFIG가 비어있으면 그냥 안 쓰고 넘어감 -->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14100c;
    --surface:#221a13;
    --surface-2:#2c2216;
    --text:#f2e6d2;
    --text-dim:#a6926f;
    --accent:#d99a3d;
    --accent-ink:#201308;
    --accent-2:#93a878;
    --gold:#e7c477;
    --border:rgba(242,230,210,0.16);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 14px 34px rgba(0,0,0,0.45);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14100c; --surface:#221a13; --surface-2:#2c2216;
      --text:#f2e6d2; --text-dim:#a6926f;
      --accent:#d99a3d; --accent-ink:#201308; --accent-2:#93a878; --gold:#e7c477;
      --border:rgba(242,230,210,0.16);
      --shadow:0 1px 2px rgba(0,0,0,0.4), 0 14px 34px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14100c; --surface:#221a13; --surface-2:#2c2216;
    --text:#f2e6d2; --text-dim:#a6926f;
    --accent:#d99a3d; --accent-ink:#201308; --accent-2:#93a878; --gold:#e7c477;
    --border:rgba(242,230,210,0.16);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 14px 34px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  .wrap{max-width:960px;margin:0 auto;padding:20px 20px 0;width:100%;}
  header.top{
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    padding-bottom:16px;border-bottom:2px solid var(--text);
  }
  .brand{display:flex;flex-direction:column;align-items:center;}
  .brand .logo{width:140px;height:140px;object-fit:contain;margin:0 auto;}
  .brand h1{
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-weight:900;
    font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:-0.01em;text-wrap:balance;
  }
  .brand h1 .glyph{color:var(--accent);}
  .brand p{margin:6px 0 0;color:var(--text-dim);font-size:14px;}
  .stats{display:flex;gap:22px;font-family:"IBM Plex Mono",monospace;justify-content:center;}
  .stat{text-align:center;min-width:64px;}
  .stat b{display:block;font-size:22px;color:var(--accent);line-height:1.1;}
  .stat span{font-size:11px;color:var(--text-dim);letter-spacing:0.04em;}

  .device-note{
    max-width:960px;margin:14px auto 0;padding:0 20px;
  }
  .device-note p{
    background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;
    padding:9px 14px;font-size:12px;color:var(--text-dim);margin:0;
  }
  .me-bar{
    text-align:center;font-size:12.5px;color:var(--text-dim);margin:10px auto 0;
  }
  .me-bar #meText{color:var(--text);font-weight:700;}
  .me-bar button{background:none;border:none;color:var(--accent);font-size:12.5px;
    text-decoration:underline;padding:0;}
  .member-card .card-head{padding-bottom:14px;}
  .member-code{
    font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;
    color:var(--gold);letter-spacing:0.02em;margin-left:4px;
  }

  nav.tabs{
    max-width:960px;margin:16px auto 0;padding:0 20px;display:flex;gap:4px;width:100%;
  }
  nav.tabs button{
    background:transparent;border:none;border-bottom:3px solid transparent;
    padding:10px 6px;margin-right:14px;font-size:15px;font-weight:700;color:var(--text-dim);
  }
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{display:block;}
  section.tab{display:none;}
  section.tab.active{display:block;}

  /* 화면을 전부 채우던 지도를 다른 섹션처럼 적당한 고정 높이로 제한 */
  #map{width:100%;height:60vh;max-height:520px;min-height:320px;}
  /* 무료·무키 정책이 계속 안정적인 표준 OSM 타일을 쓰되, 채도와 대비를 낮춰
     시각적으로 더 단순하고 차분하게 보이도록 다듬음. */
  .map-tiles-simple{ filter: grayscale(38%) saturate(55%) contrast(92%) brightness(1.1); }
  /* 헤더/탭과 같은 폭(960px)에 맞춰서 지도도 좌우로 꽉 차지 않게 정렬 */
  .map-shell{position:relative;max-width:960px;margin:0 auto;width:100%;padding:0 20px;}
  .fab{
    position:absolute;right:20px;bottom:24px;z-index:500;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;
    padding:14px 20px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);
  }
  .leaflet-popup-content{font-family:"Pretendard",sans-serif;}
  .popup-card{min-width:160px;}
  .popup-card b{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:15px;display:block;margin-bottom:2px;}
  .popup-card img{width:100%;height:90px;object-fit:cover;border-radius:6px;margin:6px 0;}
  .popup-card .meta{font-size:12px;color:var(--text-dim);}
  .popup-card .goto{
    display:inline-block;margin-top:6px;font-size:12.5px;color:var(--accent);
    text-decoration:underline;background:none;border:none;padding:0;
  }

  .wrap.board-wrap{padding-top:18px;padding-bottom:80px;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;
  }
  .search:focus{outline:2px solid var(--accent);outline-offset:1px;}
  select.sort{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;font-size:13.5px;color:var(--text);font-family:inherit;
  }
  .btn-primary{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
    padding:11px 18px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    border-radius:10px;padding:9px 14px;font-size:13.5px;
  }

  .feed{display:flex;flex-direction:column;gap:18px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:16px;
  }
  .card.flash{outline:2px solid var(--accent);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 2px;gap:12px;}
  .card-head h2{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:20px;margin:0;font-weight:700;text-wrap:balance;}
  .address{padding:0 20px;font-size:12.5px;color:var(--text-dim);}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;padding:8px 20px 14px;font-size:13px;color:var(--text-dim);align-items:center;}
  .meta-row .date{font-family:"IBM Plex Mono",monospace;color:var(--text);}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12.5px;}
  .spice{color:var(--accent);letter-spacing:1px;}
  .rating{color:var(--gold);letter-spacing:1px;}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border);}
  .photo-tile{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface-2);}
  .photo-tile img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .more-badge{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.52);color:#fff;font-size:20px;font-weight:700;
    font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;pointer-events:none;
  }
  .note{padding:14px 20px 4px;font-size:14.5px;white-space:pre-wrap;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 16px;font-size:12px;color:var(--text-dim);}
  .card-foot .del{background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:2px;}
  .card-foot .del:hover{color:var(--accent);}

  .comments-section{border-top:1px solid var(--border);padding:14px 20px 18px;}
  .comments-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .comment-item{background:var(--surface-2);border-radius:9px;padding:8px 12px;}
  .comment-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;margin-bottom:3px;}
  .comment-meta b{color:var(--text);font-weight:700;}
  .comment-del{background:none;border:none;color:var(--text-dim);font-size:11.5px;text-decoration:underline;padding:0;flex:none;}
  .comment-del:hover{color:var(--accent);}
  .comment-text{font-size:13.5px;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .comment-form{display:flex;gap:8px;}
  .comment-input{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;
  }
  .comment-submit{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;
    padding:9px 16px;font-size:13px;font-weight:700;flex:none;
  }

  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty .glyph{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:38px;color:var(--accent);display:block;margin-bottom:10px;}

  .photo-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;
    max-width:960px;margin:0 auto;padding:18px 20px 80px;width:100%;
  }
  .photo-grid button{
    padding:0;border:none;border-radius:10px;overflow:hidden;background:var(--surface-2);
    aspect-ratio:1/1;
  }
  .photo-grid img{width:100%;height:100%;object-fit:cover;display:block;}

  dialog#composer, dialog#lightbox{
    border:none;border-radius:16px;padding:0;max-width:520px;width:92vw;
    background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(20,14,10,0.55);}
  .composer-inner{padding:22px 22px 20px;max-height:85vh;overflow-y:auto;}
  .composer-inner h3{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;margin:0 0 16px;font-size:22px;}
  .field{margin-bottom:13px;position:relative;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;letter-spacing:0.02em;}
  .field input[type="text"], .field input[type="date"], .field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .starpick, .spicepick{display:flex;gap:6px;font-size:20px;}
  .starpick button, .spicepick button{background:none;border:none;color:var(--border);padding:0;}
  .starpick button.on{color:var(--gold);}
  .spicepick button.on{color:var(--accent);}
  .file-row{border:1.5px dashed var(--border);border-radius:10px;padding:12px;text-align:center;font-size:13px;color:var(--text-dim);}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;}
  .composer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:14px;}

  .place-search-box{position:relative;}
  .place-results{
    position:absolute;top:100%;left:0;right:0;z-index:10;margin-top:4px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;
  }
  .place-results button{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:9px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);
  }
  .place-results button:last-child{border-bottom:none;}
  .place-results button:hover{background:var(--surface-2);}
  .place-results .sub{display:block;font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .place-picked{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px;font-size:13px;
  }
  .place-picked .clear{background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:0;}
  .pick-on-map{margin-top:6px;font-size:12.5px;}

  .participant-box{position:relative;}
  .participant-box input{cursor:pointer;background:var(--surface);}
  .participant-dropdown{
    position:absolute;top:100%;left:0;right:0;z-index:10;margin-top:4px;padding:6px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;
  }
  .participant-dropdown .empty-note{padding:8px 10px;font-size:12.5px;color:var(--text-dim);}
  .participant-option{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:8px 10px;font-size:13.5px;color:var(--text);border-radius:8px;cursor:pointer;font-family:inherit;
  }
  .participant-option:hover{background:var(--surface-2);}
  .participant-option.selected{background:var(--surface-2);font-weight:700;}
  .participant-option .check{
    width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-ink);
  }
  .participant-option.selected .check{background:var(--accent);border-color:var(--accent);}
  .pick-hint-banner{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:600;
    background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:999px;
    font-size:13px;font-weight:700;box-shadow:var(--shadow);display:none;
  }

  #lightbox .lb-inner{padding:0;}
  #lightbox img{width:100%;max-height:70vh;object-fit:contain;background:#000;display:block;}
  #lightbox .lb-cap{padding:14px 18px;font-size:13.5px;}

  .site-footer{
    max-width:960px;margin:96px auto 0;padding:32px 20px 40px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    border-top:1px solid var(--border);
  }
  .footer-logo{width:110px;height:auto;object-fit:contain;opacity:0.85;}
  .footer-copy{margin:0;font-size:11.5px;letter-spacing:0.04em;color:var(--text-dim);font-family:"IBM Plex Mono",monospace;}
  #lightbox .lb-cap b{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;display:block;margin-bottom:2px;}
  #lightbox .lb-close{
    position:absolute;top:8px;right:10px;background:rgba(0,0,0,0.55);color:#fff;
    border:none;border-radius:999px;width:30px;height:30px;font-size:16px;
  }

  @media (prefers-reduced-motion:no-preference){ .card{transition:outline-color .2s ease;} }
</style>
</head>

<dialog id="composer">
  <form class="composer-inner" id="composerForm">
    <h3>오늘의 마라 기록</h3>

    <div class="field">
      <label>모임 장소</label>
      <div id="placePickedBox" style="display:none" class="place-picked">
        <span id="placePickedText"></span>
        <button type="button" class="clear" id="placeClear">다시 검색</button>
      </div>
      <div class="place-search-box">
        <input type="text" id="placeSearchInput" placeholder="식당 이름이나 주소로 검색" autocomplete="off" />
        <div class="place-results" id="placeResults" hidden></div>
      </div>
      <button type="button" class="btn-ghost pick-on-map" id="pickOnMapBtn">검색 대신 지도에서 직접 위치 찍기</button>
    </div>

    <div class="row2">
      <div class="field">
        <label>방문 날짜</label>
        <input type="date" id="f-date" required />
      </div>
      <div class="field">
        <label>함께 간 사람</label>
        <div class="participant-box">
          <input type="text" id="f-participants" placeholder="클릭 > 회원 이름 선택" readonly autocomplete="off" />
          <div class="participant-dropdown" id="participantDropdown" hidden></div>
        </div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>매운맛 단계</label>
        <div class="spicepick" id="spicepick">
          <button type="button" data-v="1">🌶</button><button type="button" data-v="2">🌶</button>
          <button type="button" data-v="3">🌶</button><button type="button" data-v="4">🌶</button>
          <button type="button" data-v="5">🌶</button>
        </div>
      </div>
      <div class="field">
        <label>평점</label>
        <div class="starpick" id="starpick">
          <button type="button" data-v="1">★</button><button type="button" data-v="2">★</button>
          <button type="button" data-v="3">★</button><button type="button" data-v="4">★</button>
          <button type="button" data-v="5">★</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>후기</label>
      <textarea id="f-note" placeholder="맛, 분위기, 웨이팅 등 자유롭게"></textarea>
    </div>
    <div class="field">
      <label>사진</label>
      <div class="file-row">
        <input type="file" id="f-photos" accept="image/*" multiple />
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>
    <div class="field">
      <label>작성자</label>
      <input type="text" id="f-author" placeholder="이름" />
    </div>
    <div class="composer-actions">
      <button type="button" class="btn-ghost" id="cancelComposer">취소</button>
      <button type="submit" class="btn-primary" id="submitComposer">기록 올리기</button>
    </div>
    <p class="hint">위치를 검색해 선택하거나 지도에서 직접 찍어야 저장할 수 있어요. 사진은 자동으로 압축돼요.</p>
  </form>
</dialog>

<dialog id="lightbox">
  <div class="lb-inner" style="position:relative">
    <button class="lb-close" id="lbClose">×</button>
    <img id="lbImg" src="" alt="" />
    <div class="lb-cap"><b id="lbTitle"></b><span id="lbSub"></span></div>
  </div>
</dialog>

<dialog id="onboard">
  <form class="composer-inner" id="onboardForm">
    <h3 id="onboardTitle">어서오세요</h3>
    <p id="onboardDesc" style="font-size:13.5px;color:var(--text-dim);margin:-8px 0 16px;">마라진리회 회원 명단에서 본인 이름을 선택해주세요. 다음에 다시 들어와도 자동으로 기억해둬요.</p>
    <div class="field" id="onboard-select-field" style="display:none">
      <label>회원 선택</label>
      <select id="onboard-select"></select>
    </div>
    <div class="field" id="onboard-name-field">
      <label>이름</label>
      <input type="text" id="onboard-name" placeholder="예: 햇쭈" />
    </div>
    <div class="composer-actions">
      <button type="button" class="btn-ghost" id="onboardCancel" style="display:none">취소</button>
      <button type="submit" class="btn-primary">시작하기</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Data store. Firestore(Firebase)가 설정돼 있으면 그걸로 실시간 공유하고,
  // 없으면 이 브라우저의 localStorage로만 동작(처음 버전과 동일).
  // ---------------------------------------------------------------
  var STORAGE_KEY = "malalog_posts_v1";
  function loadLocalPosts(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveLocalPosts(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    catch(e){ alert("저장에 실패했어요. 사진 용량이 크면 브라우저 저장 공간이 부족할 수 있어요."); }
  }

  // Firebase 설정 — 비워두면(null) 이 브라우저에만 저장되는 기존 방식 그대로 동작.
  // 설정 방법:
  //  1) https://console.firebase.google.com 에서 프로젝트 생성 (무료 Spark 요금제, 카드 등록 불필요)
  //  2) 프로젝트 개요 화면에서 </> (웹 앱 추가) 클릭 → 나오는 firebaseConfig 객체를 통째로 복사
  //  3) 왼쪽 메뉴 "Firestore Database" 만들기 (위치는 asia-northeast3 등 가까운 곳 선택)
  //  4) 아래 FIREBASE_CONFIG 자리에 복사한 객체를 그대로 붙여넣기
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyBPqyI-K9yK-jXIo2N2GLef7HKZQYFH6D0",
    authDomain: "maralog.firebaseapp.com",
    projectId: "maralog",
    storageBucket: "maralog.firebasestorage.app",
    messagingSenderId: "117125066890",
    appId: "1:117125066890:web:db8e0988dbcf02d3bdfd73"
  };
  /* 예시:
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSy...",
    authDomain: "프로젝트아이디.firebaseapp.com",
    projectId: "프로젝트아이디",
    storageBucket: "프로젝트아이디.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef123456"
  };
  */

  var db = null;
  if(FIREBASE_CONFIG && window.firebase){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){ console.warn("Firebase 초기화 실패, 로컬 저장으로 대체합니다.", e); db = null; }
  }

  var posts = [];

  function startDataSync(){
    var note = document.getElementById("deviceNoteText");
    if(db){
      if(note){ note.textContent = "모임원들과 실시간으로 공유되는 기록이에요."; }
      db.collection("posts").onSnapshot(function(snapshot){
        posts = snapshot.docs.map(function(d){ return d.data(); });
        renderAll();
      }, function(err){
        console.warn("Firestore 동기화 실패, 로컬 저장으로 대체합니다.", err);
        db = null;
        if(note){ note.textContent = "이 페이지는 지금은 이 브라우저에만 기록을 저장해요. (서버 연결에 실패했어요)"; }
        posts = loadLocalPosts();
        renderAll();
      });
    } else {
      posts = loadLocalPosts();
      renderAll();
    }
  }

  // ---------------------------------------------------------------
  // Members (누가 이 게시판을 쓰는지). posts와 같은 방식으로 Firestore
  // 또는 localStorage에 저장하고, 실시간으로 목록을 갱신함.
  // ---------------------------------------------------------------
  var MEMBERS_STORAGE_KEY = "malalog_members_v1";
  var ME_KEY = "malalog_me_v1";
  var members = [];
  var me = null;

  function loadLocalMembers(){
    try{ var raw = localStorage.getItem(MEMBERS_STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveLocalMembers(list){
    try{ localStorage.setItem(MEMBERS_STORAGE_KEY, JSON.stringify(list)); }catch(e){}
  }
  function loadMe(){
    try{ var raw = localStorage.getItem(ME_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function saveMe(m){
    try{ localStorage.setItem(ME_KEY, JSON.stringify(m)); }catch(e){}
  }

  function startMembersSync(){
    if(db){
      db.collection("members").onSnapshot(function(snapshot){
        members = snapshot.docs.map(function(d){ return d.data(); });
        renderMembers();
        if(document.getElementById("onboard").open && onboardMode === "login"){ applyOnboardLoginState(onboardPrefillName); }
      }, function(err){
        console.warn("회원 목록 동기화 실패, 로컬로 대체합니다.", err);
        members = loadLocalMembers();
        renderMembers();
      });
    } else {
      members = loadLocalMembers();
      renderMembers();
    }
  }

  function upsertMember(m){
    if(db){
      db.collection("members").doc(m.id).set(m).catch(function(err){
        console.warn("회원 등록 실패", err);
      });
    } else {
      var idx = members.findIndex(function(x){ return x.id === m.id; });
      if(idx === -1){ members.push(m); } else { members[idx] = m; }
      saveLocalMembers(members);
      renderMembers();
    }
  }

  // 이름이 겹치는 회원을 구별하기 위한 4자리 무작위 회원 코드.
  // 헷갈리기 쉬운 0/O, 1/I 는 빼고 생성하고, 기존 회원과 겹치면 다시 뽑음.
  function generateMemberCode(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var code;
    do{
      code = "";
      for(var i=0;i<4;i++){ code += chars.charAt(Math.floor(Math.random()*chars.length)); }
    } while(members.some(function(m){ return m.code === code; }));
    return code;
  }

  function updateMeUI(){
    var bar = document.getElementById("meBar");
    var text = document.getElementById("meText");
    if(me){
      text.textContent = me.name + (me.code ? " (#"+me.code+")" : "") + "님 안녕하세요";
      bar.style.display = "block";
    } else {
      bar.style.display = "none";
    }
  }

  var onboardMode = "login";
  var onboardPrefillName = null;

  function refreshOnboardSelect(){
    var sel = document.getElementById("onboard-select");
    var current = sel.value;
    var sorted = members.slice().sort(function(a,b){ return (a.joinedAt||0)-(b.joinedAt||0); });
    sel.innerHTML = '<option value="">-- 회원을 선택하세요 --</option>' +
      sorted.map(function(m){ return '<option value="'+m.id+'">'+esc(m.name)+(m.code ? " (#"+esc(m.code)+")" : "")+'</option>'; }).join("") +
      '<option value="__new__">＋ 새 회원으로 등록</option>';
    if(current && sel.querySelector('option[value="'+current+'"]')){ sel.value = current; }

  function toggleOnboardNameField(showName){
    document.getElementById("onboard-name-field").style.display = showName ? "block" : "none";
  }

  document.getElementById("onboard-select").addEventListener("change", function(){
    var isNew = this.value === "__new__";
    toggleOnboardNameField(isNew);
    if(isNew){
      document.getElementById("onboard-name").value = "";
      document.getElementById("onboard-name").focus();
    }
  });

  // 로그인(모드=login) 화면의 "회원 선택 vs 이름 입력" 상태를 다시 계산해서 반영함.
  // Firestore에서 회원 목록이 늦게 도착하는 경우(온라인 동기화 지연)에도
  // 다이얼로그가 열려 있는 동안 드롭다운이 뒤늦게 나타나도록 openOnboard 밖으로 분리함.
  function applyOnboardLoginState(prefillName){
    var selectField = document.getElementById("onboard-select-field");
    var nameInput = document.getElementById("onboard-name");
    var sel = document.getElementById("onboard-select");
    if(members.length){
      selectField.style.display = "block";
      refreshOnboardSelect();
      var existing = prefillName ? members.find(function(m){ return m.name === prefillName; }) : null;
      if(existing){
        sel.value = existing.id;
        toggleOnboardNameField(false);
        nameInput.value = "";
      } else if(prefillName){
        sel.value = "__new__";
        toggleOnboardNameField(true);
        nameInput.value = prefillName;
      } else {
        sel.value = "";
        toggleOnboardNameField(false);
        nameInput.value = "";
      }
    } else {
      selectField.style.display = "none";
      toggleOnboardNameField(true);
      nameInput.value = prefillName || "";
    }
  }

  function openOnboard(mode, prefillName){
    onboardMode = mode || "login";
    var titleEl = document.getElementById("onboardTitle");
    var descEl = document.getElementById("onboardDesc");
    var selectField = document.getElementById("onboard-select-field");
    var nameInput = document.getElementById("onboard-name");

    if(onboardMode === "add"){
      titleEl.textContent = "회원 추가";
      descEl.textContent = "명단에 새로 추가할 회원 이름을 입력해주세요.";
      selectField.style.display = "none";
      toggleOnboardNameField(true);
      nameInput.value = "";
      document.getElementById("onboardCancel").style.display = "inline-block";
    } else {
      titleEl.textContent = "어서오세요";
      descEl.textContent = "마라진리회 회원 명단에서 본인 이름을 선택해주세요. 다음에 다시 들어와도 자동으로 기억해둬요.";
      onboardPrefillName = prefillName || null;
      applyOnboardLoginState(prefillName);
      document.getElementById("onboardCancel").style.display = prefillName ? "inline-block" : "none";
    }
    document.getElementById("onboard").showModal();
  }

  document.getElementById("onboardForm").addEventListener("submit", function(e){
    e.preventDefault();

    if(onboardMode === "add"){
      var newName = document.getElementById("onboard-name").value.trim();
      if(!newName) return;
      upsertMember({ id: "m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), name: newName, joinedAt: Date.now(), code: generateMemberCode() });
      document.getElementById("onboard").close();
      return;
    }

    var sel = document.getElementById("onboard-select");
    var useNameField = !members.length || sel.value === "__new__";
    if(useNameField){
      var name = document.getElementById("onboard-name").value.trim();
      if(!name) return;
      if(me){
        me = { id: me.id, name: name, joinedAt: me.joinedAt, code: me.code || generateMemberCode() };
      } else {
        me = { id: "m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), name: name, joinedAt: Date.now(), code: generateMemberCode() };
      }
    } else {
      if(!sel.value) return;
      var picked = members.find(function(m){ return m.id === sel.value; });
      if(!picked) return;
      me = { id: picked.id, name: picked.name, joinedAt: picked.joinedAt, code: picked.code };
    }
    saveMe(me);
    upsertMember(me);
    updateMeUI();
    // 로그인한 회원이 바뀌면 "내 댓글/기록만 삭제 가능" 같은 권한 표시가 달라지므로 다시 그림
    if(typeof renderAll === "function"){ renderAll(); }
    document.getElementById("onboard").close();
  });
  document.getElementById("onboardCancel").addEventListener("click", function(){
    document.getElementById("onboard").close();
  });
  document.getElementById("onboard").addEventListener("cancel", function(e){
    if(onboardMode === "login" && !me){ e.preventDefault(); } // 최초 1회는 선택 전엔 닫을 수 없게
  });

  function fmtJoined(ts){
    if(!ts) return "";
    var d = new Date(ts);
    return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
  }

  function renderMembers(){
    var wrap = document.getElementById("membersFeed");
    if(wrap){
      if(!members.length){
        wrap.innerHTML = '<div class="empty"><span class="glyph">麻辣</span>아직 등록된 회원이 없어요.</div>';
      } else {
        var sorted = members.slice().sort(function(a,b){ return (a.joinedAt||0)-(b.joinedAt||0); });
        wrap.innerHTML = sorted.map(function(m){
          // 회원 코드 도입 이전에 작성된 기록(authorId 없음)은 이름으로, 그 이후는 회원 ID로 정확히 매칭함
          var count = posts.filter(function(p){
            return p.authorId ? (p.authorId === m.id) : (p.author === m.name);
          }).length;
          return (
            '<article class="card member-card">'+
              '<div class="card-head"><h2>'+esc(m.name)+(m.code ? ' <span class="member-code">#'+esc(m.code)+'</span>' : '')+'</h2></div>'+
              '<div class="meta-row"><span class="date">'+fmtJoined(m.joinedAt)+' 가입</span>'+
                '<span class="pill">기록 '+count+'개</span></div>'+
            '</article>'
          );
        }).join("");
      }
    }
    // 기록 작성 창의 "함께 간 사람" 선택 목록이 열려 있으면 최신 회원 명단으로 다시 그림
    var pd = document.getElementById("participantDropdown");
    if(pd && !pd.hidden && typeof renderParticipantDropdown === "function"){ renderParticipantDropdown(); }
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(d){
    if(!d) return "";
    var p = d.split("-");
    return p.length===3 ? p[0]+"."+p[1]+"."+p[2] : d;
  }
  function stars(n,ch,cls){
    var out = "";
    for(var i=1;i<=5;i++){ out += i<=n ? ch : "·"; }
    return '<span class="'+cls+'">'+out+'</span>';
  }

  // ---------------- tabs ----------------
  var tabButtons = document.querySelectorAll("nav.tabs button");
  var tabSections = { map: document.getElementById("tab-map"), board: document.getElementById("tab-board"), photos: document.getElementById("tab-photos"), members: document.getElementById("tab-members") };
  tabButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      tabButtons.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(tabSections).forEach(function(k){ tabSections[k].classList.remove("active"); });

      tabSections[key].classList.add("active");

    });

  function goToBoardAndFlash(postId){
    tabButtons.forEach(function(b){ b.classList.toggle("active", b.dataset.tab === "board"); });
    Object.keys(tabSections).forEach(function(k){ tabSections[k].classList.toggle("active", k === "board"); });
    setTimeout(function(){
      var el = document.querySelector('.card[data-id="'+postId+'"]');
      if(el){
        el.scrollIntoView({behavior:"smooth", block:"center"});
        el.classList.add("flash");
        setTimeout(function(){ el.classList.remove("flash"); }, 1600);
      }
    }, 50);
  }

  // ---------------- map ----------------
  // Guarded: if the Leaflet CDN fails to load (offline, blocked network),
  // the map simply stays unavailable instead of breaking the whole page —
  // the board and photo tabs keep working either way.
  // 기록이 하나도 없을 때(=지도에 맞춰 확대할 마커가 없을 때)의 기본 중심 좌표.
  // 신림역(서울 관악구) 기준값 — 나중에 필요하면 이 값만 바꾸면 됨.
  var DEFAULT_CENTER = [37.48417, 126.92972];
  var DEFAULT_ZOOM = 15;

  var map = null;
  try{
    if(typeof L !== "undefined"){
      map = L.map("map", { zoomControl:true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
      // 표준 OpenStreetMap 타일 — 키 등록 없이 계속 무료로 쓸 수 있는 몇 안 되는
      // 타일 서버라 이걸 기본으로 쓰고, 대신 CSS 필터로 채도/대비를 낮춰서
      // 시각적으로 더 차분하고 단순하게 보이도록 했음(className: "map-tiles-simple").
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        className: "map-tiles-simple",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // 아직 저장된 기록(마커)이 없을 때만 위치 기반으로 초기 시점을 잡음 —
      // 기록이 있으면 renderMarkers()가 마커들에 맞춰 알아서 확대/축소함.
      if(posts.length === 0 && navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          function(pos){
            map.setView([pos.coords.latitude, pos.coords.longitude], DEFAULT_ZOOM);
          },
          function(){ /* 권한 거부/실패 시 기본 좌표(신림역) 그대로 사용 */ },
          { timeout: 6000, maximumAge: 5 * 60 * 1000 }
        );
      }
    } else {
      document.getElementById("map").innerHTML = '<div class="empty" style="padding:40px 20px"><span class="glyph">麻辣</span>지도를 불러오지 못했어요.<br/>인터넷 연결을 확인하고 새로고침 해주세요.</div>';
    }
  }catch(err){ console.warn("map init failed", err); }

  var markers = {};
  function renderMarkers(){
    if(!map) return;
    Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
    markers = {};
    var pts = [];
    posts.forEach(function(p){
      if(typeof p.lat !== "number" || typeof p.lng !== "number") return;
      var m = L.marker([p.lat, p.lng]).addTo(map);
      var thumb = (p.photos && p.photos[0]) ? '<img src="'+p.photos[0]+'" alt="" />' : "";
      m.bindPopup(
        '<div class="popup-card">'+
          '<b>'+esc(p.restaurant)+'</b>'+
          '<span class="meta">'+fmtDate(p.date)+(p.rating?(' · '+stars(p.rating,"★","rating")):"")+'</span>'+
          thumb+
          '<button type="button" class="goto" data-goto="'+p.id+'">게시판에서 보기</button>'+
        '</div>'
      );
      markers[p.id] = m;
      pts.push([p.lat, p.lng]);
    });
    if(pts.length){ map.fitBounds(pts, { padding:[40,40], maxZoom:15 }); }
  }
  if(map){
    map.on("popupopen", function(e){
      var btn = e.popup._contentNode.querySelector("[data-goto]");
      if(btn){ btn.addEventListener("click", function(){ goToBoardAndFlash(btn.getAttribute("data-goto")); }); }
    });
  }

  // ---------------- place search ----------------
  // OpenStreetMap(Nominatim)만으로는 작은 개인 식당이 거의 검색이 안 됨 — OSM은
  // 국내 소상공인 POI 데이터가 매우 부실해서 역/관공서/큰 랜드마크 정도만 잡힘.
  // 그래서 카카오 로컬 API(국내 업체 커버리지가 훨씬 좋음)를 우선 쓰고, 키가
  // 없거나 실패하면 Nominatim으로 자동 대체함.
  //
  // 카카오 키 설정 방법:
  //  1) https://developers.kakao.com 에서 애플리케이션 생성 (무료, 카드 등록 불필요)
  //  2) "앱 키"에서 JavaScript 키 복사
  //  3) 앱 설정 > 플랫폼 > Web 에 이 페이지가 열릴 도메인을 등록
  //     (예: https://내아이디.github.io — 로컬에서 테스트할 땐 http://localhost:포트도 추가)
  //  4) 아래 KAKAO_JS_KEY 에 붙여넣기
  var KAKAO_JS_KEY = "d779acf887fb153b502e8bd629ce0b32"; // 비워두면("") Nominatim만 사용

  var kakaoReady = false;
  if(KAKAO_JS_KEY){
    var kakaoScript = document.createElement("script");
    kakaoScript.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + encodeURIComponent(KAKAO_JS_KEY) + "&libraries=services&autoload=false";
    kakaoScript.onload = function(){
      if(window.kakao && kakao.maps){ kakao.maps.load(function(){ kakaoReady = true; }); }
    };
    kakaoScript.onerror = function(){ console.warn("카카오 지도 SDK를 불러오지 못했어요. Nominatim으로 대체합니다."); };
    document.head.appendChild(kakaoScript);
  }

  var placeInput = document.getElementById("placeSearchInput");
  var placeResults = document.getElementById("placeResults");
  var placePickedBox = document.getElementById("placePickedBox");
  var placePickedText = document.getElementById("placePickedText");
  var placeClear = document.getElementById("placeClear");
  var pickOnMapBtn = document.getElementById("pickOnMapBtn");
  var pickHintBanner = document.getElementById("pickHintBanner");

  var selectedPlace = null; // {name, address, lat, lng}
  var searchTimer = null;
  var searchAbort = null;
  var searchSeq = 0; // 응답이 늦게 와서 최신 검색어 결과를 덮어쓰는 걸 방지

  function showPicked(place){
    selectedPlace = place;
    placeInput.style.display = "none";
    placeResults.hidden = true;
    placePickedBox.style.display = "flex";
    placePickedText.textContent = place.name + (place.address ? " · " + place.address : "");
  }
  function clearPicked(){
    selectedPlace = null;
    placeInput.style.display = "";
    placeInput.value = "";
    placePickedBox.style.display = "none";
  }
  placeClear.addEventListener("click", clearPicked);

  placeInput.addEventListener("input", function(){
    var q = placeInput.value.trim();
    if(searchTimer) clearTimeout(searchTimer);
    if(q.length < 2){ placeResults.hidden = true; placeResults.innerHTML = ""; return; }
    searchTimer = setTimeout(function(){ runPlaceSearch(q); }, 550);
  });

  function showPlaceMsg(text){
    placeResults.innerHTML = '<div style="padding:10px 12px;font-size:12.5px;color:var(--text-dim)">'+esc(text)+'</div>';
    placeResults.hidden = false;
  }

  function renderPlaceResults(list){
    if(!list.length){
      showPlaceMsg("검색 결과가 없어요. 지도에서 직접 위치를 찍어보세요.");
      return;
    }
    placeResults.innerHTML = list.map(function(item, i){
      return '<button type="button" data-i="'+i+'">'+esc(item.name)+
        (item.address ? '<span class="sub">'+esc(item.address)+'</span>' : "")+'</button>';
    }).join("");
    placeResults.hidden = false;
    Array.prototype.forEach.call(placeResults.querySelectorAll("button"), function(btn, i){
      btn.addEventListener("click", function(){ showPicked(list[i]); });
    });
  }

  function runPlaceSearch(q){
    var seq = ++searchSeq;
    showPlaceMsg("검색 중…");
    if(kakaoReady){
      searchWithKakao(q, seq);
    } else {
      searchWithNominatim(q, seq);
    }
  }

  function searchWithKakao(q, seq){
    var places = new kakao.maps.services.Places();
    places.keywordSearch(q, function(data, status){
      if(seq !== searchSeq) return; // 이미 다음 검색어로 넘어감
      if(status !== kakao.maps.services.Status.OK){
        // 카카오 쪽 문제(권한/도메인 미등록 등)면 Nominatim으로 조용히 대체
        searchWithNominatim(q, seq);
        return;
      }
      renderPlaceResults(data.map(function(item){
        return {
          name: item.place_name,
          address: item.road_address_name || item.address_name || "",
          lat: parseFloat(item.y),
          lng: parseFloat(item.x)
        };
      }));
    });
  }

  function searchWithNominatim(q, seq){
    if(searchAbort) searchAbort.abort();
    searchAbort = new AbortController();
    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ko&q=" + encodeURIComponent(q);
    fetch(url, { signal: searchAbort.signal, headers: { "Accept": "application/json" } })
      .then(function(r){
        if(!r.ok){ throw new Error("http_" + r.status); }
        return r.json();
      })
      .then(function(list){
        if(seq !== searchSeq) return;
        renderPlaceResults(list.map(function(item){
          return {
            name: item.display_name.split(",")[0],
            address: item.display_name,
            lat: parseFloat(item.lat),
            lng: parseFloat(item.lon)
          };
        }));
      })
      .catch(function(err){
        if(err.name === "AbortError") return; // 새 검색어로 대체됨 — 정상 동작
        if(seq !== searchSeq) return;
        console.warn("place search failed", err);
        showPlaceMsg("검색에 실패했어요 (네트워크 문제일 수 있어요). 지도에서 직접 위치를 찍어보세요.");
      });
  }

  var pickingOnMap = false;
  pickOnMapBtn.addEventListener("click", function(){
    if(!map){ alert("지도를 불러오지 못해 직접 찍기를 쓸 수 없어요. 검색으로 위치를 찾아주세요."); return; }
    pickingOnMap = true;
    dlg.close();
    pickHintBanner.style.display = "block";
  });
  if(map){
    map.on("click", function(e){
      if(!pickingOnMap) return;
      pickingOnMap = false;
      pickHintBanner.style.display = "none";
      var lat = e.latlng.lat, lng = e.latlng.lng;
      reverseGeocode(lat, lng).then(function(name){
        showPicked({ name: name || "선택한 위치", address: "", lat: lat, lng: lng });
        dlg.showModal();
      });
    });
  }
  function reverseGeocode(lat, lng){
    var url = "https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ko&lat="+lat+"&lon="+lng;
    return fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.display_name) return null;
      return (d.name || d.display_name.split(",")[0]);
    }).catch(function(){ return null; });
  }

  // ---------------- render: stats / board / photos ----------------
  function renderStats(){
    var restaurants = {};
    var totalRating = 0, ratingCount = 0;
    posts.forEach(function(p){ restaurants[p.restaurant]=true; if(p.rating){ totalRating+=p.rating; ratingCount++; } });
    var avg = ratingCount ? (totalRating/ratingCount).toFixed(1) : "–";
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>'+posts.length+'</b><span>총 방문</span></div>'+
      '<div class="stat"><b>'+Object.keys(restaurants).length+'</b><span>탐방한 맛집</span></div>'+
      '<div class="stat"><b>'+avg+'</b><span>평균 평점</span></div>';
  }

  function currentList(){
    var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
    var sort = document.getElementById("sortSelect").value;
    var list = posts.filter(function(p){ return !q || (p.restaurant||"").toLowerCase().indexOf(q) !== -1; });
    list = list.slice();
    if(sort==="rating"){ list.sort(function(a,b){ return (b.rating||0)-(a.rating||0); }); }
    else if(sort==="spice"){ list.sort(function(a,b){ return (b.spice||0)-(a.spice||0); }); }
    else { list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }); }
    return list;
  }

  function renderFeed(){
    var feed = document.getElementById("feed");
    var list = currentList();
    if(list.length===0){
      feed.innerHTML = '<div class="empty"><span class="glyph">麻辣</span>아직 기록이 없어요.<br/>지도에서 첫 마라 탐방을 남겨보세요.</div>';
      return;
    }
    feed.innerHTML = list.map(function(p){
      var photosHtml = "";
      if(p.photos && p.photos.length){
        var shownPhotos = p.photos.slice(0,3);
        var extraCount = p.photos.length - shownPhotos.length;
        photosHtml = '<div class="photos">'+shownPhotos.map(function(src, i){
          var isLastTile = extraCount > 0 && i === shownPhotos.length - 1;
          return '<div class="photo-tile">'+
            '<img src="'+src+'" alt="'+esc(p.restaurant)+' 사진" loading="lazy" data-lightbox="'+esc(src)+'" data-cap="'+esc(p.restaurant)+'|'+esc(fmtDate(p.date))+'" />'+
            (isLastTile ? '<div class="more-badge">+'+extraCount+'</div>' : "")+
          '</div>';
        }).join("")+'</div>';
      }
      var participants = (p.participants&&p.participants.length)
        ? p.participants.map(function(n){return '<span class="pill">'+esc(n)+'</span>';}).join("") : "";
      return (
        '<article class="card" data-id="'+p.id+'">'+
          '<div class="card-head"><h2>'+esc(p.restaurant)+'</h2>'+(p.rating ? stars(p.rating,"★","rating") : "")+'</div>'+
          (p.address ? '<div class="address">'+esc(p.address)+'</div>' : "")+
          '<div class="meta-row"><span class="date">'+fmtDate(p.date)+'</span>'+
            (p.spice ? '<span class="pill">'+stars(p.spice,"🌶","spice")+'</span>' : "")+participants+'</div>'+
          photosHtml+
          (p.note ? '<div class="note">'+esc(p.note)+'</div>' : "")+
          '<div class="card-foot"><span>'+(p.author?esc(p.author)+' 기록':"")+'</span>'+
            '<button type="button" class="del" data-del="'+p.id+'">삭제</button></div>'+
          renderCommentsSection(p)+
        '</article>'
      );
    }).join("");
  }

  // 게시글 카드 하단의 댓글 목록 + 입력창. 로그인이 이미 필수라 작성자 이름은
  // 별도 입력 없이 me.name/me.id 를 그대로 사용함.
  function renderCommentsSection(p){
    var list = p.comments || [];
    var itemsHtml = list.map(function(c){
      var canDelete = me && c.authorId && c.authorId === me.id;
      return (
        '<div class="comment-item">'+
          '<div class="comment-meta"><b>'+esc(c.author||"익명")+'</b>'+
            (canDelete ? '<button type="button" class="comment-del" data-del-comment="'+c.id+'" data-post-id="'+p.id+'">삭제</button>' : "")+
          '</div>'+
          '<div class="comment-text">'+esc(c.text)+'</div>'+
        '</div>'
      );
    }).join("");
    return (
      '<div class="comments-section">'+
        (list.length ? '<div class="comments-list">'+itemsHtml+'</div>' : "")+
        '<form class="comment-form" data-comment-form="'+p.id+'">'+
          '<input type="text" class="comment-input" placeholder="댓글을 남겨보세요" maxlength="300" autocomplete="off" required />'+
          '<button type="submit" class="comment-submit">등록</button>'+
        '</form>'+
      '</div>'
    );
  }

  function renderPhotoGrid(){
    var grid = document.getElementById("photoGrid");
    var items = [];
    posts.forEach(function(p){
      (p.photos||[]).forEach(function(src){ items.push({src:src, restaurant:p.restaurant, date:p.date}); });
    });
    items.sort(function(){ return 0; });
    if(items.length===0){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="glyph">麻辣</span>아직 올라온 사진이 없어요.</div>';
      return;
    }
    grid.innerHTML = items.map(function(it){
      return '<button type="button" data-lightbox="'+esc(it.src)+'" data-cap="'+esc(it.restaurant)+'|'+esc(fmtDate(it.date))+'"><img src="'+it.src+'" alt="'+esc(it.restaurant)+'" loading="lazy" /></button>';
    }).join("");
  }

  function renderAll(){
    renderStats();
    renderMarkers();
    renderFeed();
    renderPhotoGrid();
    // 회원별 "기록 N개" 숫자는 posts에 의존하므로, posts가 새로고침될 때마다 같이 갱신함
    if(typeof renderMembers === "function"){ renderMembers(); }
  }

  // ---------------- lightbox ----------------
  var lightbox = document.getElementById("lightbox");
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-lightbox]");
    if(!t) return;
    var cap = (t.getAttribute("data-cap")||"").split("|");
    document.getElementById("lbImg").src = t.getAttribute("data-lightbox");
    document.getElementById("lbTitle").textContent = cap[0]||"";
    document.getElementById("lbSub").textContent = cap[1]||"";
    lightbox.showModal();
  });
  document.getElementById("lbClose").addEventListener("click", function(){ lightbox.close(); });
  lightbox.addEventListener("click", function(e){ if(e.target === lightbox) lightbox.close(); });

  // ---------------- add / delete ----------------
  function addPost(post){
    if(db){
      db.collection("posts").doc(post.id).set(post).catch(function(err){
        console.warn("저장 실패", err);
        alert("서버에 저장하지 못했어요. 네트워크를 확인하고 다시 시도해주세요.");
      });
      // Firestore의 onSnapshot이 알아서 posts를 갱신하고 다시 그려줌
    } else {
      posts.push(post);
      saveLocalPosts(posts);
      renderAll();
    }
  }
  function deletePost(id){
    if(!confirm("이 기록을 삭제할까요?")) return;
    if(db){
      db.collection("posts").doc(id).delete().catch(function(err){
        console.warn("삭제 실패", err);
        alert("삭제에 실패했어요. 네트워크를 확인해주세요.");
      });
    } else {
      posts = posts.filter(function(p){ return p.id !== id; });
      saveLocalPosts(posts);
      renderAll();
    }
  }
  document.getElementById("feed").addEventListener("click", function(e){
    var btn = e.target.closest("[data-del]");
    if(btn){ deletePost(btn.getAttribute("data-del")); return; }
    var delCommentBtn = e.target.closest("[data-del-comment]");
    if(delCommentBtn){
      if(!confirm("댓글을 삭제할까요?")) return;
      deleteComment(delCommentBtn.getAttribute("data-post-id"), delCommentBtn.getAttribute("data-del-comment"));
    }
  });
  document.getElementById("feed").addEventListener("submit", function(e){
    var form = e.target.closest("[data-comment-form]");
    if(!form) return;
    e.preventDefault();
    var postId = form.getAttribute("data-comment-form");
    var input = form.querySelector(".comment-input");
    var text = input.value.trim();
    if(!text) return;
    addComment(postId, text);
  });

  // 댓글은 게시글(post) 문서 안에 comments 배열로 함께 저장함(별도 컬렉션 없이 단순하게).
  function persistComments(postId, newComments){
    if(db){
      db.collection("posts").doc(postId).update({ comments: newComments }).catch(function(err){
        console.warn("댓글 저장 실패", err);
        alert("댓글을 저장하지 못했어요. 네트워크를 확인해주세요.");
      });
    } else {
      var post = posts.find(function(p){ return p.id === postId; });
      if(post){ post.comments = newComments; saveLocalPosts(posts); renderAll(); }
    }
  }
  function addComment(postId, text){
    if(!me){ return; } // 로그인 전에는 댓글 폼 자체가 노출되지 않지만 방어적으로 한 번 더 체크
    var post = posts.find(function(p){ return p.id === postId; });
    if(!post) return;
    var comment = {
      id: "c_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      authorId: me.id, author: me.name, text: text, createdAt: Date.now()
    };
    var newComments = (post.comments || []).concat([comment]);
    persistComments(postId, newComments);
  }
  function deleteComment(postId, commentId){
    var post = posts.find(function(p){ return p.id === postId; });
    if(!post) return;
    var newComments = (post.comments || []).filter(function(c){ return c.id !== commentId; });
    persistComments(postId, newComments);
  }
  document.getElementById("searchInput").addEventListener("input", renderFeed);
  document.getElementById("sortSelect").addEventListener("change", renderFeed);

  // ---------------- composer ----------------
  var dlg = document.getElementById("composer");
  var pendingPhotos = [];
  var spiceVal = 0, ratingVal = 0;
  var selectedParticipants = [];
  var participantInput = document.getElementById("f-participants");
  var participantDropdown = document.getElementById("participantDropdown");

  function syncParticipantInput(){
    participantInput.value = selectedParticipants.join(", ");
  }

  function renderParticipantDropdown(){
    if(!members.length){
      participantDropdown.innerHTML = '<div class="empty-note">등록된 회원이 없어요. 먼저 회원 탭에서 추가해주세요.</div>';
      return;
    }
    // 이름이 겹치는 회원이 있으면 회원 코드를 붙여서 구분함
    var nameCounts = {};
    members.forEach(function(m){ nameCounts[m.name] = (nameCounts[m.name]||0) + 1; });
    var sorted = members.slice().sort(function(a,b){ return (a.joinedAt||0)-(b.joinedAt||0); });
    participantDropdown.innerHTML = sorted.map(function(m){
      var label = m.name + ((nameCounts[m.name] > 1 && m.code) ? " (#"+m.code+")" : "");
      var on = selectedParticipants.indexOf(label) !== -1;
      return '<button type="button" class="participant-option'+(on?" selected":"")+'" data-label="'+esc(label)+'">'+
        '<span class="check">'+(on?"✓":"")+'</span>'+esc(label)+
      '</button>';
    }).join("");
  }

  participantInput.addEventListener("click", function(){
    renderParticipantDropdown();
    participantDropdown.hidden = false;
  });
  participantDropdown.addEventListener("click", function(e){
    var btn = e.target.closest(".participant-option");
    if(!btn) return;
    // innerHTML을 통째로 다시 그리면 클릭 이벤트가 버블링되는 도중 대상 노드가
    // 이미 DOM에서 떨어져나가 document의 바깥클릭 감지(closest)가 실패하므로,
    // 여기서는 해당 버튼만 직접 갱신함.
    var label = btn.dataset.label;
    var idx = selectedParticipants.indexOf(label);
    var checkEl = btn.querySelector(".check");
    if(idx === -1){
      selectedParticipants.push(label);
      btn.classList.add("selected");
      if(checkEl){ checkEl.textContent = "✓"; }
    } else {
      selectedParticipants.splice(idx,1);
      btn.classList.remove("selected");
      if(checkEl){ checkEl.textContent = ""; }
    }
    syncParticipantInput();
  });
  document.addEventListener("click", function(e){
    if(!participantDropdown.hidden && !e.target.closest(".participant-box")){
      participantDropdown.hidden = true;
    }
  });

  function resetComposer(){
    document.getElementById("composerForm").reset();
    clearPicked();
    placeResults.hidden = true; placeResults.innerHTML = "";
    pendingPhotos = []; spiceVal = 0; ratingVal = 0;
    document.getElementById("thumbs").innerHTML = "";
    paintPicker("spicepick", 0); paintPicker("starpick", 0);
    document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
    document.getElementById("f-author").value = me ? me.name : "";
    selectedParticipants = [];
    syncParticipantInput();
    participantDropdown.hidden = true;
  }
  function paintPicker(id, val){
    var wrap = document.getElementById(id);
    Array.prototype.forEach.call(wrap.children, function(btn, i){ btn.classList.toggle("on", i < val); });
  }
  document.getElementById("spicepick").addEventListener("click", function(e){
    if(e.target.tagName!=="BUTTON") return;
    spiceVal = parseInt(e.target.dataset.v,10); paintPicker("spicepick", spiceVal);
  });
  document.getElementById("starpick").addEventListener("click", function(e){
    if(e.target.tagName!=="BUTTON") return;
    ratingVal = parseInt(e.target.dataset.v,10); paintPicker("starpick", ratingVal);
  });

  function resizeImage(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var maxW = 900, scale = Math.min(1, maxW / img.width);
          var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = function(){ resolve(null); };
        img.src = reader.result;
      };
      reader.onerror = function(){ resolve(null); };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById("f-photos").addEventListener("change", async function(e){
    var files = Array.prototype.slice.call(e.target.files || []).slice(0,6);
    var thumbs = document.getElementById("thumbs");
    for(var i=0;i<files.length;i++){
      var dataUrl = await resizeImage(files[i]);
      if(dataUrl){ pendingPhotos.push(dataUrl); var img = document.createElement("img"); img.src = dataUrl; thumbs.appendChild(img); }
    }
  });

  document.getElementById("openComposer").addEventListener("click", function(){ resetComposer(); dlg.showModal(); });
  document.getElementById("cancelComposer").addEventListener("click", function(){ dlg.close(); });

  document.getElementById("composerForm").addEventListener("submit", function(e){
    e.preventDefault();
    if(!selectedPlace){
      alert("모임 장소를 검색해서 선택하거나, 지도에서 직접 위치를 찍어주세요.");
      return;
    }
    var post = {
      id: "p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      restaurant: selectedPlace.name,
      address: selectedPlace.address,
      lat: selectedPlace.lat,
      lng: selectedPlace.lng,
      date: document.getElementById("f-date").value,
      participants: selectedParticipants.slice(),
      spice: spiceVal,
      rating: ratingVal,
      note: document.getElementById("f-note").value.trim(),
      photos: pendingPhotos.slice(),
      author: document.getElementById("f-author").value.trim(),
      authorId: me ? me.id : null,
      createdAt: Date.now()
    };
    dlg.close();
    addPost(post);
  });

  // ---------------- boot ----------------
  document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
  me = loadMe();
  if(!me){ openOnboard(); } else { updateMeUI(); }
  startMembersSync();
  startDataSync();
})();
</script>
</body>
</html>
